[package]
name = "ekko"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1", features = ["derive"]}
toml = "0.8"
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal"]}
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tower-http = { version = "0.7.1", features = ["trace", "catch-panic"] }
